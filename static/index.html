<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e5e5e5;
        }
        input:focus {
            border-color: #444;
            outline: none;
        }
        input::placeholder {
            color: #666;
        }
        button {
            cursor: pointer;
        }
        .btn-primary {
            background: #333;
            color: #e5e5e5;
            border: none;
        }
        .btn-primary:hover {
            background: #444;
        }
        .btn-icon {
            background: transparent;
            color: #666;
        }
        .btn-icon:hover {
            color: #e5e5e5;
        }
        .btn-quick {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e5e5e5;
        }
        .btn-quick:hover {
            background: #222;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        .container {
            max-width: 56rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .flex-1 {
            flex: 1;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .justify-center {
            justify-content: center;
        }
        .space-x-2 > * + * {
            margin-left: 0.5rem;
        }
        .space-x-3 > * + * {
            margin-left: 0.75rem;
        }
        .space-y-2 > * + * {
            margin-top: 0.5rem;
        }
        .space-y-3 > * + * {
            margin-top: 0.75rem;
        }
        .grid {
            display: grid;
        }
        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .grid-cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        .gap-2 {
            gap: 0.5rem;
        }
        .gap-3 {
            gap: 0.75rem;
        }
        .gap-4 {
            gap: 1rem;
        }
        .p-2 {
            padding: 0.5rem;
        }
        .p-3 {
            padding: 0.75rem;
        }
        .p-4 {
            padding: 1rem;
        }
        .p-6 {
            padding: 1.5rem;
        }
        .p-8 {
            padding: 2rem;
        }
        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .px-5 {
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .py-3 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        .py-4 {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .py-6 {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }
        .py-8 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .mt-1 {
            margin-top: 0.25rem;
        }
        .mt-3 {
            margin-top: 0.75rem;
        }
        .mt-4 {
            margin-top: 1rem;
        }
        .mb-1 {
            margin-bottom: 0.25rem;
        }
        .mb-2 {
            margin-bottom: 0.5rem;
        }
        .mb-4 {
            margin-bottom: 1rem;
        }
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        .mx-4 {
            margin-left: 1rem;
            margin-right: 1rem;
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .text-sm {
            font-size: 0.875rem;
        }
        .text-lg {
            font-size: 1.125rem;
        }
        .text-xl {
            font-size: 1.25rem;
        }
        .text-2xl {
            font-size: 1.5rem;
        }
        .font-medium {
            font-weight: 500;
        }
        .font-semibold {
            font-weight: 600;
        }
        .text-white {
            color: white;
        }
        .text-gray-300 {
            color: #d1d5db;
        }
        .text-gray-400 {
            color: #9ca3af;
        }
        .text-gray-500 {
            color: #6b7280;
        }
        .text-indigo-400 {
            color: #818cf8;
        }
        .text-indigo-300 {
            color: #a5b4fc;
        }
        .text-purple-400 {
            color: #c084fc;
        }
        .text-red-400 {
            color: #f87171;
        }
        .bg-white\/5 {
            background: rgba(255, 255, 255, 0.05);
        }
        .bg-white\/10 {
            background: rgba(255, 255, 255, 0.1);
        }
        .rounded-lg {
            border-radius: 0.5rem;
        }
        .rounded-xl {
            border-radius: 0.75rem;
        }
        .rounded-2xl {
            border-radius: 1rem;
        }
        .w-full {
            width: 100%;
        }
        .h-8 {
            height: 2rem;
        }
        .min-h-screen {
            min-height: 100vh;
        }
        .max-h-70vh {
            max-height: 70vh;
        }
        .max-w-4xl {
            max-width: 56rem;
        }
        .max-w-lg {
            max-width: 32rem;
        }
        .relative {
            position: relative;
        }
        .absolute {
            position: absolute;
        }
        .right-2 {
            right: 0.5rem;
        }
        .top-2 {
            top: 0.5rem;
        }
        .fixed {
            position: fixed;
        }
        .inset-0 {
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        .z-50 {
            z-index: 50;
        }
        .hidden {
            display: none;
        }
        .overflow-y-auto {
            overflow-y: auto;
        }
        .transition {
            transition: all 0.2s;
        }
        .opacity-60 {
            opacity: 0.6;
        }
        .group-hover\:opacity-100:hover {
            opacity: 1;
        }
        .border-b {
            border-bottom: 1px solid;
        }
        .border-white\/5 {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .backdrop-blur-sm {
            backdrop-filter: blur(4px);
        }
        .bg-black\/60 {
            background: rgba(0, 0, 0, 0.6);
        }
        .tracking-tight {
            letter-spacing: -0.025em;
        }
        .col-span-2 {
            grid-column: span 2;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="p-6 border-b border-gray-800">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="font-semibold text-xl">OSINT</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="showHistory()" class="p-2 btn-icon rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                    <button onclick="showCorrelations()" class="p-2 btn-icon rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="max-w-4xl mx-auto">
                <!-- Search -->
                <div class="card rounded-lg p-6 mb-6">
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="IP, domain, email, phone..."
                            class="flex-1 px-4 py-3 rounded"
                            onkeypress="if(event.key === 'Enter') performSearch()"
                        >
                        <button onclick="performSearch()" class="btn-primary px-6 py-3 rounded">
                            Search
                        </button>
                    </div>
                    <div id="detectedType" class="mt-2 text-xs text-gray-500"></div>
                </div>

                <!-- Quick Actions -->
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <button onclick="setSearchType('ip')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">🌐</div>
                        <div class="text-xs">IP</div>
                    </button>
                    <button onclick="setSearchType('domain')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">🔗</div>
                        <div class="text-xs">Domain</div>
                    </button>
                    <button onclick="setSearchType('email')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">📧</div>
                        <div class="text-xs">Email</div>
                    </button>
                    <button onclick="setSearchType('phone')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">📱</div>
                        <div class="text-xs">Phone</div>
                    </button>
                    <button onclick="setSearchType('mac')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">🔌</div>
                        <div class="text-xs">MAC</div>
                    </button>
                    <button onclick="setSearchType('hash')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">🔐</div>
                        <div class="text-xs">Hash</div>
                    </button>
                    <button onclick="setSearchType('ssl')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">🔒</div>
                        <div class="text-xs">SSL</div>
                    </button>
                    <button onclick="setSearchType('dns-full')" class="btn-quick p-3 rounded text-center">
                        <div class="text-lg mb-1">📡</div>
                        <div class="text-xs">DNS</div>
                    </button>
                </div>

                <!-- Results -->
                <div id="resultsSection" class="hidden">
                    <div class="card rounded-lg p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-medium">Results</h3>
                            <button onclick="performDeepAnalyze()" class="text-xs text-gray-400 hover:text-white">
                                Deep analyze
                            </button>
                        </div>
                        <div id="resultsContent"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- History Modal -->
        <div id="historyModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
            <div class="card rounded-lg p-6 max-w-lg w-full mx-4 max-h-70vh overflow-y-auto">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-medium">History</h3>
                    <button onclick="closeModal('historyModal')" class="p-2 btn-icon rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="historyContent"></div>
            </div>
        </div>

        <!-- Correlations Modal -->
        <div id="correlationsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
            <div class="card rounded-lg p-6 max-w-lg w-full mx-4 max-h-70vh overflow-y-auto">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-medium">Correlations</h3>
                    <button onclick="closeModal('correlationsModal')" class="p-2 btn-icon rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="correlationsContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let sessionId = localStorage.getItem('sessionId') || generateSessionId();
        localStorage.setItem('sessionId', sessionId);
        let currentSearchValue = '';
        let currentSearchType = '';

        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substr(2, 9);
        }

        function setSearchType(type) {
            const input = document.getElementById('searchInput');
            input.placeholder = `Введите ${type}...`;
            input.focus();
        }

        async function detectType(input) {
            try {
                const response = await fetch(`${API_URL}/detect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input })
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Detection error:', error);
                return null;
            }
        }

        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const value = e.target.value.trim();
            const detectedDiv = document.getElementById('detectedType');
            
            if (value.length > 2) {
                const detected = await detectType(value);
                if (detected) {
                    detectedDiv.textContent = `🧠 Распознано как: ${detected.type.toUpperCase()}`;
                    currentSearchType = detected.type;
                }
            } else {
                detectedDiv.textContent = '';
            }
        });

        async function performSearch() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return;

            currentSearchValue = input;
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsSection.classList.remove('hidden');
            resultsContent.innerHTML = `
                <div class="flex items-center justify-center py-8">
                    <div class="typing-indicator flex space-x-2">
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    </div>
                </div>
            `;

            const endpoint = getEndpointForType(currentSearchType);
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        [getFieldForType(currentSearchType)]: input,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultsContent.innerHTML = `
                        <div class="text-red-400 text-center py-4">
                            ❌ ${data.error}
                        </div>
                    `;
                } else {
                    displayResults(data);
                }
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="text-red-400 text-center py-4">
                        ❌ Ошибка: ${error.message}
                    </div>
                `;
            }
        }

        function getEndpointForType(type) {
            const endpoints = {
                'ip': '/ip',
                'domain': '/domain',
                'email': '/email',
                'phone': '/phone',
                'username': '/username',
                'name': '/username',
                'url': '/domain',
                'mac': '/mac',
                'hash': '/hash',
                'ssl': '/ssl',
                'dns-full': '/dns-full',
                'http-headers': '/http-headers',
                'wayback': '/wayback'
            };
            return endpoints[type] || '/analyze';
        }

        function getFieldForType(type) {
            const fields = {
                'ip': 'ip',
                'domain': 'domain',
                'email': 'email',
                'phone': 'phone',
                'username': 'username',
                'name': 'username',
                'url': 'domain',
                'mac': 'mac',
                'hash': 'hash',
                'ssl': 'domain',
                'dns-full': 'domain',
                'http-headers': 'url',
                'wayback': 'url'
            };
            return fields[type] || 'input';
        }

        function displayResults(data) {
            const resultsContent = document.getElementById('resultsContent');
            let html = '';

            if (data.type === 'ip') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Country</div>
                                <div>${data.country || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">City</div>
                                <div>${data.city || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">ISP</div>
                                <div>${data.isp || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Organization</div>
                                <div>${data.org || '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'domain') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">IP</div>
                                <div>${data.ip || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Registrar</div>
                                <div>${data.registrar || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Created</div>
                                <div>${data.created || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Expires</div>
                                <div>${data.expires || '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'email') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Domain</div>
                                <div>${data.domain || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">MX Valid</div>
                                <div>${data.mx_valid ? 'Yes' : 'No'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'phone') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Valid</div>
                                <div>${data.valid ? 'Yes' : 'No'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Country</div>
                                <div>${data.country || '—'}</div>
                            </div>
                            <div class="card p-2 rounded col-span-2">
                                <div class="text-gray-500 text-xs">Carrier</div>
                                <div>${data.carrier || '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'username') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="space-y-1">
                            ${Object.entries(data.platforms).map(([platform, url]) => `
                                <a href="${url}" target="_blank" class="block card p-2 rounded text-sm hover:bg-gray-800">
                                    ${platform}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (data.type === 'mac') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Vendor</div>
                                <div>${data.vendor || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Normalized</div>
                                <div>${data.normalized || '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'hash') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value.substring(0, 16)}...</div>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Type</div>
                                <div>${data.hash_type || '—'}</div>
                            </div>
                            <div class="card p-2 rounded col-span-2">
                                <div class="text-gray-500 text-xs">Note</div>
                                <div>${data.note || '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'ssl') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="space-y-1 text-sm">
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Subject</div>
                                <div>${JSON.stringify(data.subject) || '—'}</div>
                            </div>
                            <div class="card p-2 rounded">
                                <div class="text-gray-500 text-xs">Issuer</div>
                                <div>${JSON.stringify(data.issuer) || '—'}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="card p-2 rounded">
                                    <div class="text-gray-500 text-xs">Valid From</div>
                                    <div>${data.not_before || '—'}</div>
                                </div>
                                <div class="card p-2 rounded">
                                    <div class="text-gray-500 text-xs">Valid To</div>
                                    <div>${data.not_after || '—'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (data.type === 'dns-full') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="space-y-1 text-sm">
                            ${Object.entries(data.records).map(([type, records]) => `
                                <div class="card p-2 rounded">
                                    <div class="text-gray-500 text-xs">${type}</div>
                                    <div>${records.length > 0 ? records.join(', ') : '—'}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (data.type === 'http-headers') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="card p-2 rounded text-sm">
                            <div class="text-gray-500 text-xs">Status Code</div>
                            <div>${data.status_code || '—'}</div>
                        </div>
                        <div class="space-y-1 max-h-60 overflow-y-auto text-sm">
                            ${Object.entries(data.headers).map(([key, value]) => `
                                <div class="card p-2 rounded">
                                    <div class="text-gray-500 text-xs">${key}</div>
                                    <div class="text-gray-400">${value}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (data.type === 'wayback') {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="card p-2 rounded text-sm">
                            <div class="text-gray-500 text-xs">Total Snapshots</div>
                            <div>${data.total || 0}</div>
                        </div>
                        ${data.snapshots && data.snapshots.length > 0 ? `
                            <div class="space-y-1 text-sm">
                                ${data.snapshots.slice(0, 5).map(snap => `
                                    <div class="card p-2 rounded">
                                        <div>${snap[1] || '—'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<div class="text-gray-500 text-sm">No snapshots found</div>'}
                    </div>
                `;
            } else if (data.type && data.type.startsWith('analyze_')) {
                html = `
                    <div class="space-y-2">
                        <div class="font-medium">${data.value}</div>
                        <div class="space-y-1 text-sm">
                            ${data.results.map(r => `
                                <div class="card p-2 rounded">
                                    <div class="text-gray-500 text-xs">${r.key}</div>
                                    <div>${r.value || '—'}</div>
                                </div>
                            `).join('')}
                        </div>
                        ${data.correlations.length > 0 ? `
                            <div class="mt-2">
                                <div class="text-gray-500 text-xs mb-1">Correlations</div>
                                ${data.correlations.map(c => `
                                    <div class="card p-2 rounded text-xs">
                                        ${c.type}: ${c.value}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            resultsContent.innerHTML = html;
        }

        async function performDeepAnalyze() {
            if (!currentSearchValue) return;

            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = `
                <div class="flex items-center justify-center py-8">
                    <div class="typing-indicator flex space-x-2">
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    </div>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        input: currentSearchValue,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="text-red-400 text-center py-4">
                        ❌ Ошибка: ${error.message}
                    </div>
                `;
            }
        }

        async function showHistory() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            
            content.innerHTML = '<div class="text-center py-4">Загрузка...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const response = await fetch(`${API_URL}/history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    content.innerHTML = data.history.map(item => `
                        <div class="input-glass rounded-lg p-3 mb-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-medium text-indigo-400">${item.type.toUpperCase()}</span>
                                <span class="text-gray-500 text-xs">${new Date(item.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="text-gray-300 text-sm mt-1">${item.value}</div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm">No history</div>';
                }
            } catch (error) {
                content.innerHTML = `<div class="text-red-400 text-center py-4">Ошибка: ${error.message}</div>`;
            }
        }

        async function showCorrelations() {
            const modal = document.getElementById('correlationsModal');
            const content = document.getElementById('correlationsContent');
            
            content.innerHTML = '<div class="text-center py-4">Загрузка...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const response = await fetch(`${API_URL}/correlations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                
                const data = await response.json();
                
                if (data.correlations && data.correlations.length > 0) {
                    content.innerHTML = data.correlations.map(c => `
                        <div class="input-glass rounded-lg p-3 mb-2">
                            <span class="text-xs font-medium text-indigo-400">${c.type}</span>
                            <span class="text-gray-300 text-sm">: ${c.value}</span>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm">No correlations</div>';
                }
            } catch (error) {
                content.innerHTML = `<div class="text-red-400 text-center py-4 text-sm">Error: ${error.message}</div>`;
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.querySelectorAll('[id$="Modal"]').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        });
    </script>
</body>
</html>
