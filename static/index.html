<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            color: white;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            outline: none;
        }
        .input-glass::placeholder {
            color: #6b7280;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            border: none;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .bg-gradient-to-br {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .result-card {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        .typing-indicator span {
            animation: bounce 1.4s infinite;
            display: inline-block;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            margin: 0 3px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }
        .container {
            max-width: 56rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .flex-1 {
            flex: 1;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .justify-center {
            justify-content: center;
        }
        .space-x-2 > * + * {
            margin-left: 0.5rem;
        }
        .space-x-3 > * + * {
            margin-left: 0.75rem;
        }
        .space-y-2 > * + * {
            margin-top: 0.5rem;
        }
        .space-y-3 > * + * {
            margin-top: 0.75rem;
        }
        .grid {
            display: grid;
        }
        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .grid-cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        .gap-2 {
            gap: 0.5rem;
        }
        .gap-3 {
            gap: 0.75rem;
        }
        .gap-4 {
            gap: 1rem;
        }
        .p-2 {
            padding: 0.5rem;
        }
        .p-3 {
            padding: 0.75rem;
        }
        .p-4 {
            padding: 1rem;
        }
        .p-6 {
            padding: 1.5rem;
        }
        .p-8 {
            padding: 2rem;
        }
        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .px-5 {
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .py-3 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        .py-4 {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .py-6 {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }
        .py-8 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .mt-1 {
            margin-top: 0.25rem;
        }
        .mt-3 {
            margin-top: 0.75rem;
        }
        .mt-4 {
            margin-top: 1rem;
        }
        .mb-1 {
            margin-bottom: 0.25rem;
        }
        .mb-2 {
            margin-bottom: 0.5rem;
        }
        .mb-4 {
            margin-bottom: 1rem;
        }
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        .mx-4 {
            margin-left: 1rem;
            margin-right: 1rem;
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .text-sm {
            font-size: 0.875rem;
        }
        .text-lg {
            font-size: 1.125rem;
        }
        .text-xl {
            font-size: 1.25rem;
        }
        .text-2xl {
            font-size: 1.5rem;
        }
        .font-medium {
            font-weight: 500;
        }
        .font-semibold {
            font-weight: 600;
        }
        .text-white {
            color: white;
        }
        .text-gray-300 {
            color: #d1d5db;
        }
        .text-gray-400 {
            color: #9ca3af;
        }
        .text-gray-500 {
            color: #6b7280;
        }
        .text-indigo-400 {
            color: #818cf8;
        }
        .text-indigo-300 {
            color: #a5b4fc;
        }
        .text-purple-400 {
            color: #c084fc;
        }
        .text-red-400 {
            color: #f87171;
        }
        .bg-white\/5 {
            background: rgba(255, 255, 255, 0.05);
        }
        .bg-white\/10 {
            background: rgba(255, 255, 255, 0.1);
        }
        .rounded-lg {
            border-radius: 0.5rem;
        }
        .rounded-xl {
            border-radius: 0.75rem;
        }
        .rounded-2xl {
            border-radius: 1rem;
        }
        .w-full {
            width: 100%;
        }
        .h-8 {
            height: 2rem;
        }
        .min-h-screen {
            min-height: 100vh;
        }
        .max-h-70vh {
            max-height: 70vh;
        }
        .max-w-4xl {
            max-width: 56rem;
        }
        .max-w-lg {
            max-width: 32rem;
        }
        .relative {
            position: relative;
        }
        .absolute {
            position: absolute;
        }
        .right-2 {
            right: 0.5rem;
        }
        .top-2 {
            top: 0.5rem;
        }
        .fixed {
            position: fixed;
        }
        .inset-0 {
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        .z-50 {
            z-index: 50;
        }
        .hidden {
            display: none;
        }
        .overflow-y-auto {
            overflow-y: auto;
        }
        .transition {
            transition: all 0.2s;
        }
        .opacity-60 {
            opacity: 0.6;
        }
        .group-hover\:opacity-100:hover {
            opacity: 1;
        }
        .border-b {
            border-bottom: 1px solid;
        }
        .border-white\/5 {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .backdrop-blur-sm {
            backdrop-filter: blur(4px);
        }
        .bg-black\/60 {
            background: rgba(0, 0, 0, 0.6);
        }
        .tracking-tight {
            letter-spacing: -0.025em;
        }
        .col-span-2 {
            grid-column: span 2;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="min-h-screen flex flex-col" style="position: relative; z-index: 1;">
        <!-- Header -->
        <header class="p-6 border-b border-white/5" style="background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px);">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br flex items-center justify-center" style="box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <span class="font-semibold text-xl tracking-tight" style="background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">OSINT</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="showHistory()" class="p-3 hover:bg-white/5 rounded-xl transition" style="transition: all 0.3s ease;">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                    <button onclick="showCorrelations()" class="p-3 hover:bg-white/5 rounded-xl transition" style="transition: all 0.3s ease;">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="max-w-4xl mx-auto">
                <!-- Search -->
                <div class="glass rounded-3xl p-8 mb-8" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="IP, domain, email, phone, username..."
                            class="w-full px-6 py-5 input-glass rounded-2xl text-white placeholder-gray-500 focus:outline-none transition text-base"
                            onkeypress="if(event.key === 'Enter') performSearch()"
                            style="font-size: 1rem;"
                        >
                        <button 
                            onclick="performSearch()"
                            class="absolute right-3 top-3 btn-primary rounded-xl text-sm font-medium transition"
                        >
                            Search
                        </button>
                    </div>
                    <div id="detectedType" class="mt-4 text-xs text-gray-500 text-center" style="font-weight: 500;"></div>
                </div>

                <!-- Quick Actions -->
                <div class="grid grid-cols-4 gap-4 mb-8">
                    <button onclick="setSearchType('ip')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">🌐</div>
                        <div class="text-xs text-gray-400 font-medium">IP</div>
                    </button>
                    <button onclick="setSearchType('domain')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">🔗</div>
                        <div class="text-xs text-gray-400 font-medium">Domain</div>
                    </button>
                    <button onclick="setSearchType('email')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">📧</div>
                        <div class="text-xs text-gray-400 font-medium">Email</div>
                    </button>
                    <button onclick="setSearchType('phone')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">📱</div>
                        <div class="text-xs text-gray-400 font-medium">Phone</div>
                    </button>
                    <button onclick="setSearchType('mac')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">🔌</div>
                        <div class="text-xs text-gray-400 font-medium">MAC</div>
                    </button>
                    <button onclick="setSearchType('hash')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">🔐</div>
                        <div class="text-xs text-gray-400 font-medium">Hash</div>
                    </button>
                    <button onclick="setSearchType('ssl')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">🔒</div>
                        <div class="text-xs text-gray-400 font-medium">SSL</div>
                    </button>
                    <button onclick="setSearchType('dns-full')" class="glass p-5 rounded-2xl hover:bg-white/10 transition text-center group" style="transition: all 0.3s ease;">
                        <div class="text-2xl mb-2 opacity-60 group-hover:opacity-100 transition" style="transition: all 0.3s ease;">📡</div>
                        <div class="text-xs text-gray-400 font-medium">DNS</div>
                    </button>
                </div>

                <!-- Results -->
                <div id="resultsSection" class="hidden">
                    <div class="glass rounded-3xl p-8" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(139, 92, 246, 0.02) 100%);">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-base font-medium text-gray-200" style="font-weight: 600;">Results</h3>
                            <button onclick="performDeepAnalyze()" class="text-xs text-indigo-400 hover:text-indigo-300 transition px-4 py-2 rounded-xl hover:bg-white/5" style="transition: all 0.3s ease;">
                                Deep analyze
                            </button>
                        </div>
                        <div id="resultsContent"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- History Modal -->
        <div id="historyModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 backdrop-blur-sm">
            <div class="glass rounded-3xl p-8 max-w-lg w-full mx-4 max-h-70vh overflow-y-auto" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-base font-medium" style="font-weight: 600;">History</h3>
                    <button onclick="closeModal('historyModal')" class="p-2 hover:bg-white/10 rounded-xl transition" style="transition: all 0.3s ease;">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="historyContent"></div>
            </div>
        </div>

        <!-- Correlations Modal -->
        <div id="correlationsModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 backdrop-blur-sm">
            <div class="glass rounded-3xl p-8 max-w-lg w-full mx-4 max-h-70vh overflow-y-auto" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-base font-medium" style="font-weight: 600;">Correlations</h3>
                    <button onclick="closeModal('correlationsModal')" class="p-2 hover:bg-white/10 rounded-xl transition" style="transition: all 0.3s ease;">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="correlationsContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let sessionId = localStorage.getItem('sessionId') || generateSessionId();
        localStorage.setItem('sessionId', sessionId);
        let currentSearchValue = '';
        let currentSearchType = '';

        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substr(2, 9);
        }

        function setSearchType(type) {
            const input = document.getElementById('searchInput');
            input.placeholder = `Введите ${type}...`;
            input.focus();
        }

        async function detectType(input) {
            try {
                const response = await fetch(`${API_URL}/detect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input })
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Detection error:', error);
                return null;
            }
        }

        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const value = e.target.value.trim();
            const detectedDiv = document.getElementById('detectedType');
            
            if (value.length > 2) {
                const detected = await detectType(value);
                if (detected) {
                    detectedDiv.textContent = `🧠 Распознано как: ${detected.type.toUpperCase()}`;
                    currentSearchType = detected.type;
                }
            } else {
                detectedDiv.textContent = '';
            }
        });

        async function performSearch() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return;

            currentSearchValue = input;
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsSection.classList.remove('hidden');
            resultsContent.innerHTML = `
                <div class="flex items-center justify-center py-8">
                    <div class="typing-indicator flex space-x-2">
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    </div>
                </div>
            `;

            const endpoint = getEndpointForType(currentSearchType);
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        [getFieldForType(currentSearchType)]: input,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultsContent.innerHTML = `
                        <div class="text-red-400 text-center py-4">
                            ❌ ${data.error}
                        </div>
                    `;
                } else {
                    displayResults(data);
                }
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="text-red-400 text-center py-4">
                        ❌ Ошибка: ${error.message}
                    </div>
                `;
            }
        }

        function getEndpointForType(type) {
            const endpoints = {
                'ip': '/ip',
                'domain': '/domain',
                'email': '/email',
                'phone': '/phone',
                'username': '/username',
                'name': '/username',
                'url': '/domain',
                'mac': '/mac',
                'hash': '/hash',
                'ssl': '/ssl',
                'dns-full': '/dns-full',
                'http-headers': '/http-headers',
                'wayback': '/wayback'
            };
            return endpoints[type] || '/analyze';
        }

        function getFieldForType(type) {
            const fields = {
                'ip': 'ip',
                'domain': 'domain',
                'email': 'email',
                'phone': 'phone',
                'username': 'username',
                'name': 'username',
                'url': 'domain',
                'mac': 'mac',
                'hash': 'hash',
                'ssl': 'domain',
                'dns-full': 'domain',
                'http-headers': 'url',
                'wayback': 'url'
            };
            return fields[type] || 'input';
        }

        function displayResults(data) {
            const resultsContent = document.getElementById('resultsContent');
            let html = '';

            if (data.type === 'ip') {
                html = `
                    <div class="result-card space-y-3">
                        <div class="flex items-center space-x-2 text-indigo-400">
                            <span class="text-xl">🌐</span>
                            <span class="font-medium">${data.value}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="input-glass rounded-lg p-3">
                                <div class="text-gray-500 text-xs mb-1">Country</div>
                                <div class="text-sm">${data.country || '—'}</div>
                            </div>
                            <div class="input-glass rounded-lg p-3">
                                <div class="text-gray-500 text-xs mb-1">City</div>
                                <div class="text-sm">${data.city || '—'}</div>
                            </div>
                            <div class="input-glass rounded-lg p-3">
                                <div class="text-gray-500 text-xs mb-1">ISP</div>
                                <div class="text-sm">${data.isp || '—'}</div>
                            </div>

                    <div class="result-card space-y-3">

                    <div class="result-card space-y-3">

                            </div>

                                <div class="text-sm">${data.carrier || '—'}</div>

            } else if (data.type === 'username') {
                html = `
                    <div class="result-card space-y-3">
                        <div class="flex items-center space-x-2 text-indigo-400">

                            <span class="font-medium">${data.value}</span>
                        </div>
                        <div class="space-y-2">
                            ${Object.entries(data.platforms).map(([platform, url]) => `
                                <a href="${url}" target="_blank" class="block input-glass hover:bg-white/10 rounded-lg p-3 transition">
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm">${platform}</span>
                                        <span class="text-indigo-400">→</span>

            } else if (data.type === 'mac') {
                html = `
                    <div class="result-card space-y-3">
                        <div class="flex items-center space-x-2 text-indigo-400">

                            <div class="input-glass rounded-lg p-3">

                            <span class="font-medium">${data.value.substring(0, 16)}...</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="input-glass rounded-lg p-3">
                                <div class="text-gray-500 text-xs mb-1">Type</div>

                    <div class="result-card space-y-3">

                            <div class="input-glass rounded-lg p-3">
                                <div class="text-gray-500 text-xs mb-1">Subject</div>

                            <div class="input-glass rounded-lg p-3">

            } else if (data.type === 'http-headers') {

                    <div class="result-card space-y-3">

                        </div>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${Object.entries(data.headers).map(([key, value]) => `
                                <div class="input-glass rounded-lg p-2">

                        </div>

                            <span class="text-xl">🧠</span>

        async function performDeepAnalyze() {
            if (!currentSearchValue) return;

            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = `
                <div class="flex items-center justify-center py-8">
                    <div class="typing-indicator flex space-x-2">
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    </div>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        input: currentSearchValue,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="text-red-400 text-center py-4">
                        ❌ Ошибка: ${error.message}
                    </div>
                `;
            }
        }

        async function showHistory() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            
            content.innerHTML = '<div class="text-center py-4">Загрузка...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const response = await fetch(`${API_URL}/history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    content.innerHTML = data.history.map(item => `
                        <div class="input-glass rounded-lg p-3 mb-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-medium text-indigo-400">${item.type.toUpperCase()}</span>
                                <span class="text-gray-500 text-xs">${new Date(item.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="text-gray-300 text-sm mt-1">${item.value}</div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm">No history</div>';
                }
            } catch (error) {
                content.innerHTML = `<div class="text-red-400 text-center py-4">Ошибка: ${error.message}</div>`;
            }
        }

        async function showCorrelations() {
            const modal = document.getElementById('correlationsModal');
            const content = document.getElementById('correlationsContent');
            
            content.innerHTML = '<div class="text-center py-4">Загрузка...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const response = await fetch(`${API_URL}/correlations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                
                const data = await response.json();
                
                if (data.correlations && data.correlations.length > 0) {
                    content.innerHTML = data.correlations.map(c => `
                        <div class="input-glass rounded-lg p-3 mb-2">
                            <span class="text-xs font-medium text-indigo-400">${c.type}</span>
                            <span class="text-gray-300 text-sm">: ${c.value}</span>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm">No correlations</div>';
                }
            } catch (error) {
                content.innerHTML = `<div class="text-red-400 text-center py-4 text-sm">Error: ${error.message}</div>`;
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.querySelectorAll('[id$="Modal"]').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        });
    </script>
